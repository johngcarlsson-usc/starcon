[package]
name = "starcon"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Modern rewrite of Star Control: TimeWarp (TW-Light), a fan Star Control melee game"
publish = false

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_core_pipeline",
    "bevy_state",
    "bevy_log",
    "bevy_asset",
    "png",
    "x11",
    "webgl2",
    "default_font",
] }
bevy_ggrs = "0.21"
bevy_matchbox = { version = "0.14", features = ["ggrs"] }
ggrs = "0.11"
serde = { version = "1", features = ["derive"] }
rust-ini = "0.21"
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
