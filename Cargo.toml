[package]
name = "starcon"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Modern rewrite of Star Control: TimeWarp (TW-Light), a fan Star Control melee game"
publish = false
default-run = "starcon"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_core_pipeline",
    "bevy_state",
    "bevy_log",
    "bevy_asset",
    "bevy_audio",
    "wav",
    "mp3",
    "vorbis",
    "png",
    "x11",
    "webgl2",
    "default_font",
] }
bevy_ggrs = "0.21"
bevy_matchbox = { version = "0.14", features = ["ggrs"] }
ggrs = "0.12"
# Needed by the GgrsChannelAdapter in netplay.rs: matchbox_socket
# 0.14 ships a ggrs-0.11 NonBlockingSocket impl on WebRtcChannel,
# but bevy_ggrs 0.21 needs the ggrs-0.12 trait. We re-do the
# serde<->packet bridge ourselves over matchbox's raw bytes.
bincode = { version = "2", features = ["serde"] }
# 2D physics. `parallel` is disabled so physics runs single-threaded — needed
# for cross-machine determinism under GGRS rollback (M4).
avian2d = { version = "0.6", default-features = false, features = ["2d", "f32", "parry-f32"] }
serde = { version = "1", features = ["derive"] }
rust-ini = "0.21"
bytemuck = { version = "1", features = ["derive"] }
# Small fast PRNG for one-shot per-frame jitter (Zoq-Fot-Pik shot
# spread, etc). Non-deterministic across runs; when M4 rollback
# netcode lands, replace with a seeded RNG resource.
fastrand = "2"

# Only pulled in for the offline asset extractor (`cargo run --bin extract_dat`).
# Activated via the `tools` feature so the game binary stays lean.
image = { version = "0.25", default-features = false, features = ["bmp", "png"], optional = true }
serde_json = { version = "1", optional = true }
virtual_joystick = "2.7"

[features]
default = []
tools = ["dep:image", "dep:serde_json"]

[[bin]]
name = "starcon"
path = "src/main.rs"

[[bin]]
name = "extract_dat"
path = "tools/extract_dat.rs"
required-features = ["tools"]

# Browser-only deps used by netplay.rs to read the `?signal=`
# query param from the URL bar so users can point at their own
# matchbox server without recompiling.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "EventTarget",
    "DeviceOrientationEvent",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
