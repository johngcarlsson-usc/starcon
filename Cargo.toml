[package]
name = "starcon"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Modern rewrite of Star Control: TimeWarp (TW-Light), a fan Star Control melee game"
publish = false
default-run = "starcon"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_core_pipeline",
    "bevy_state",
    "bevy_log",
    "bevy_asset",
    "png",
    "x11",
    "webgl2",
    "default_font",
] }
bevy_ggrs = "0.21"
bevy_matchbox = { version = "0.14", features = ["ggrs"] }
ggrs = "0.11"
# 2D physics. `parallel` is disabled so physics runs single-threaded — needed
# for cross-machine determinism under GGRS rollback (M4).
avian2d = { version = "0.6", default-features = false, features = ["2d", "f32", "parry-f32"] }
serde = { version = "1", features = ["derive"] }
rust-ini = "0.21"
bytemuck = { version = "1", features = ["derive"] }
# Small fast PRNG for one-shot per-frame jitter (Zoq-Fot-Pik shot
# spread, etc). Non-deterministic across runs; when M4 rollback
# netcode lands, replace with a seeded RNG resource.
fastrand = "2"

# Only pulled in for the offline asset extractor (`cargo run --bin extract_dat`).
# Activated via the `tools` feature so the game binary stays lean.
image = { version = "0.25", default-features = false, features = ["bmp", "png"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
tools = ["dep:image", "dep:serde_json"]

[[bin]]
name = "starcon"
path = "src/main.rs"

[[bin]]
name = "extract_dat"
path = "tools/extract_dat.rs"
required-features = ["tools"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
