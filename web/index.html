<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- iOS: launch full-screen (no URL bar) when added to Home Screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Starcon">
  <meta name="theme-color" content="#05060a">
  <link rel="manifest" href="./manifest.json?v=__BUILD_SHA__">
  <link rel="apple-touch-icon" href="./assets/ui/icon-180.png">
  <link rel="icon" type="image/png" href="./assets/ui/icon-192.png">
  <title>Starcon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #05060a;
      color: #cfd6e0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      letter-spacing: 0.04em;
      z-index: 10;
      pointer-events: none;
    }
    #loading small { display: block; opacity: 0.6; margin-top: 0.5em; font-size: 14px; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    Loading Starcon&hellip;
    <small>first load is ~50 MB, subsequent loads are instant</small>
  </div>
  <script>
    // Browsers create AudioContext in 'suspended' state until a
    // user gesture, and bevy_audio (via cpal+rodio) doesn't auto-
    // resume on WASM — so the first few seconds of audio play to
    // a paused context = silence and a console warning.
    //
    // We Proxy the AudioContext constructor so every context Bevy
    // creates lands in a Set, then resume()-all on any user input.
    // This script is SYNCHRONOUS (not type=module) so it runs before
    // the wasm-bindgen JS imports and the patch is in place before
    // Bevy ever asks for an AudioContext. Also covers webkitAudioContext
    // for older Safari.
    (function () {
      var Original = window.AudioContext || window.webkitAudioContext;
      if (!Original) return;
      var contexts = new Set();
      var gestureSeen = false;
      var Wrapped = new Proxy(Original, {
        construct: function (target, args, newTarget) {
          var ctx = Reflect.construct(target, args, newTarget);
          contexts.add(ctx);
          // Only attempt immediate resume if a user gesture has
          // already happened — otherwise the browser logs a
          // "AudioContext was not allowed to start" warning even
          // though we don't actually need to play yet.
          if (gestureSeen && ctx.state === 'suspended') {
            ctx.resume().catch(function () {});
          }
          return ctx;
        }
      });
      try {
        Object.defineProperty(window, 'AudioContext', {
          value: Wrapped, writable: true, configurable: true,
        });
        Object.defineProperty(window, 'webkitAudioContext', {
          value: Wrapped, writable: true, configurable: true,
        });
      } catch (e) {
        // Older browsers may forbid redefinition; fall back to
        // direct assignment.
        window.AudioContext = Wrapped;
        window.webkitAudioContext = Wrapped;
      }
      function resumeAll() {
        gestureSeen = true;
        contexts.forEach(function (c) {
          if (c.state === 'suspended') {
            c.resume().catch(function () {});
          }
        });
      }
      // Listen on both window and document, capture phase, so
      // even if Bevy's canvas listener calls stopPropagation we
      // see the event first.
      var events = ['pointerdown', 'mousedown', 'touchstart', 'keydown', 'click'];
      events.forEach(function (ev) {
        window.addEventListener(ev, resumeAll, { capture: true, passive: true });
        document.addEventListener(ev, resumeAll, { capture: true, passive: true });
      });
    })();
  </script>
  <script type="module">
    // ?v=__BUILD_SHA__ is replaced by the CI workflow with this
    // commit's short SHA so the import URL changes on every deploy.
    // Without it, GH Pages' default cache headers can serve stale
    // starcon.js to returning visitors for ~10 min — which during
    // active iteration is "every visit feels broken".
    import init from './starcon.js?v=__BUILD_SHA__';
    init('./starcon_bg.wasm?v=__BUILD_SHA__')
      .then(() => {
        const el = document.getElementById('loading');
        if (el) el.remove();
      })
      .catch((err) => {
        const el = document.getElementById('loading');
        if (el) {
          el.style.color = '#ff8080';
          el.textContent = 'Failed to start: ' + err;
        }
        console.error(err);
      });
  </script>
  <script>
    // Hide the browser chrome on the first user gesture where we can.
    // - Android Chrome / desktop: the Fullscreen API works on an
    //   element and removes the URL bar entirely.
    // - iOS Safari: element fullscreen is unsupported; the only way
    //   to lose the URL bar is "Add to Home Screen" (handled by the
    //   apple-mobile-web-app-* meta tags above). So this is a no-op
    //   there and that's fine.
    // Gesture-gated because requestFullscreen() must be called from a
    // user activation or the browser rejects it.
    (function () {
      function goFullscreen() {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
          try { req.call(el).catch(function () {}); } catch (e) {}
        }
      }
      var events = ['pointerdown', 'touchstart', 'click'];
      function once() {
        goFullscreen();
        events.forEach(function (ev) {
          window.removeEventListener(ev, once, true);
        });
      }
      events.forEach(function (ev) {
        window.addEventListener(ev, once, { capture: true, passive: true });
      });
    })();
  </script>
  <!-- build: __BUILD_SHA__ -->
</body>
</html>
