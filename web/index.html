<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starcon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #05060a;
      color: #cfd6e0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      letter-spacing: 0.04em;
      z-index: 10;
      pointer-events: none;
    }
    #loading small { display: block; opacity: 0.6; margin-top: 0.5em; font-size: 14px; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    Loading Starcon&hellip;
    <small>first load is ~50 MB, subsequent loads are instant</small>
  </div>
  <script type="module">
    import init from './starcon.js';
    init()
      .then(() => {
        const el = document.getElementById('loading');
        if (el) el.remove();
      })
      .catch((err) => {
        const el = document.getElementById('loading');
        if (el) {
          el.style.color = '#ff8080';
          el.textContent = 'Failed to start: ' + err;
        }
        console.error(err);
      });
  </script>
</body>
</html>
