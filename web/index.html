<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starcon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #05060a;
      color: #cfd6e0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      letter-spacing: 0.04em;
      z-index: 10;
      pointer-events: none;
    }
    #loading small { display: block; opacity: 0.6; margin-top: 0.5em; font-size: 14px; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    Loading Starcon&hellip;
    <small>first load is ~50 MB, subsequent loads are instant</small>
  </div>
  <script type="module">
    // Browsers create AudioContext in `suspended` state until a user
    // gesture. Bevy/rodio doesn't auto-resume on WASM, so the first
    // few seconds of audio play to a paused context = silence. Patch
    // the AudioContext constructor so we can collect every context
    // and call `resume()` on the first input event.
    const _AudioContext = window.AudioContext || window.webkitAudioContext;
    if (_AudioContext) {
      const ctxs = [];
      const Wrapped = function (...args) {
        const ctx = new _AudioContext(...args);
        ctxs.push(ctx);
        return ctx;
      };
      Wrapped.prototype = _AudioContext.prototype;
      window.AudioContext = Wrapped;
      window.webkitAudioContext = Wrapped;
      const resume = () => {
        for (const c of ctxs) {
          if (c.state === 'suspended') c.resume().catch(() => {});
        }
      };
      ['click', 'touchstart', 'keydown', 'pointerdown'].forEach((ev) => {
        window.addEventListener(ev, resume, { capture: true });
      });
    }

    // ?v=__BUILD_SHA__ is replaced by the CI workflow with this
    // commit's short SHA so the import URL changes on every deploy.
    // Without it, GH Pages' default cache headers can serve stale
    // starcon.js to returning visitors for ~10 min — which during
    // active iteration is "every visit feels broken".
    import init from './starcon.js?v=__BUILD_SHA__';
    init('./starcon_bg.wasm?v=__BUILD_SHA__')
      .then(() => {
        const el = document.getElementById('loading');
        if (el) el.remove();
      })
      .catch((err) => {
        const el = document.getElementById('loading');
        if (el) {
          el.style.color = '#ff8080';
          el.textContent = 'Failed to start: ' + err;
        }
        console.error(err);
      });
  </script>
  <!-- build: __BUILD_SHA__ -->
</body>
</html>
